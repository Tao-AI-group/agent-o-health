name: Ontology website

on:
  push:
    branches: [main]
    paths:
      - 'ontology/**'
      - 'shapes/**'
      - 'queries/**'
      - 'data/examples/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'ontology/**'
      - 'shapes/**'
      - 'queries/**'
      - 'data/examples/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontology-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Validate ontology
        run: |
          python scripts/build_integrated_ontology.py
          python scripts/validate_ontology.py
          python scripts/run_shacl_validation.py
          python scripts/run_sparql_cqs.py
          python -m pytest -q
      - name: Build and check ontology website
        run: |
          python scripts/build_site.py
          python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
