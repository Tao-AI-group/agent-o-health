[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-card-intake-chatbot"
version = "0.1.0"
description = "Ontology-driven conversational intake for AGENT-O Agent Cards"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "httpx>=0.28,<0.29",
  "owlrl>=7.1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyshacl>=0.30",
  "PyYAML>=6.0",
  "rdflib>=7.1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
  "live: opt-in tests that call the configured institutional LLM gateway",
]
